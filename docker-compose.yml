services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bachata
      POSTGRES_PASSWORD: bachata
      POSTGRES_DB: bachata_hub
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bachata -d bachata_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bachata:bachata@db:5432/bachata_hub
      # DIRECT_URL обязателен для схемы (prisma migrate deploy ниже упадёт без
      # него) — локальный "db" без pgbouncer, так что то же самое подключение
      # подходит и для миграций, и для обычных запросов.
      DIRECT_URL: postgresql://bachata:bachata@db:5432/bachata_hub
      # Без дефолта: если NEXTAUTH_SECRET/SESSION_SECRET не заданы в .env,
      # `docker compose up` должен упасть с понятной ошибкой, а не тихо
      # подняться на предсказуемом ключе (см. .env.example — как сгенерировать).
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Задайте NEXTAUTH_SECRET в .env (см. .env.example) — без дефолта, это ключ подписи сессий}
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env (см. .env.example) — без дефолта, это ключ подписи сессий}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NODE_ENV: production
      # Live-таблица оценок (score-relay.ts) — необязательные: без них фича
      # просто не покажет live-обновления (см. .env.example), никакая другая
      # часть сайта от них не зависит. ВАЖНО: имеют смысл только если
      # DATABASE_URL выше указывает на тот же Supabase-проект, что и эти
      # ключи — по умолчанию в этом docker-compose.yml DATABASE_URL смотрит
      # на локальный одноразовый контейнер "db" (postgres:16-alpine), а не на
      # Supabase, так что live-обновления здесь работать не будут, даже если
      # ключи заданы, пока DATABASE_URL не переключат на реальный Supabase.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "3000:3000"
    # На первом запуске применяем миграции и наполняем демо-данными,
    # затем стартуем сервер — так `docker compose up` полностью
    # поднимает рабочий сайт одной командой.
    command: >
      sh -c "npx prisma migrate deploy &&
             npx tsx prisma/seed-if-empty.ts &&
             node server.js"

volumes:
  db_data:
